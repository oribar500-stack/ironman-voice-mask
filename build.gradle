plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    maven {
        name = 'MaxHenkel'
        url = 'https://maven.maxhenkel.de/repository/public'
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

def localDepsDir = file("${rootDir}/.gradle/ironman-local-deps")
def geckoJar = new File(localDepsDir, "geckolib-fabric-1.21.11-5.4.5.jar")
def geckoUrl = "https://cdn.modrinth.com/data/8BmcQJ2H/versions/G1BvHQDL/geckolib-fabric-1.21.11-5.4.5.jar"

if (!geckoJar.exists() || geckoJar.length() < 100_000L) {
    localDepsDir.mkdirs()
    logger.lifecycle("Downloading exact GeckoLib 5.4.5 Fabric JAR...")
    ant.get(
        src: geckoUrl,
        dest: geckoJar,
        verbose: true,
        usetimestamp: false
    )
}

if (!geckoJar.exists() || geckoJar.length() < 100_000L) {
    throw new GradleException("GeckoLib download failed or produced an invalid file: ${geckoJar}")
}

def geckoZip = new java.util.zip.ZipFile(geckoJar)
try {
    // GeckoLib 5.4.5 still uses the software.bernie.geckolib Java package.
    // The previous source imported the newer com.geckolib namespace.
    def requiredEntry = "software/bernie/geckolib/renderer/GeoArmorRenderer.class"

    if (geckoZip.getEntry(requiredEntry) == null) {
        def candidates = []
        def entries = geckoZip.entries()
        while (entries.hasMoreElements()) {
            def name = entries.nextElement().name
            if (name.endsWith("/GeoArmorRenderer.class")) {
                candidates.add(name)
            }
        }

        throw new GradleException(
            "Downloaded GeckoLib JAR does not contain ${requiredEntry}. " +
            "Found renderer candidates: ${candidates}"
        )
    }

    logger.lifecycle("Verified GeckoLib 5.4.5 package namespace: software.bernie.geckolib")
} finally {
    geckoZip.close()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Concrete, verified GeckoLib Fabric JAR.
    modImplementation files(geckoJar)

    implementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    modRuntimeOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}:fabric-stub"
    modRuntimeOnly "maven.modrinth:simple-voice-chat:fabric-${voicechat_version}"

    include implementation("net.sf.phat:sphinx4-core:5prealpha")
    include implementation("net.sf.phat:sphinx4-data:5prealpha")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "loader_version", loader_version
    inputs.property "fabric_version", fabric_version
    inputs.property "geckolib_version", geckolib_version
    inputs.property "voicechat_api_version", voicechat_api_version

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_version": minecraft_version,
            "loader_version": loader_version,
            "fabric_version": fabric_version,
            "geckolib_version": geckolib_version,
            "voicechat_api_version": voicechat_api_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}
